<div class="shell"><aside class="sidebar"><div class="school"><span class="school-mark">●</span><div>INSTITUCIÓN<br>EDUCATIVA CERRO ALEGRE</div></div>
<nav><a routerLink="/home" routerLinkActive="active" title="Panel general">● <span>Panel general</span></a><a routerLink="/cases" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" title="Casos">● <span>Casos</span></a><a routerLink="/cases/nuevo" routerLinkActive="active" title="Registrar caso">● <span>Registrar caso</span></a><a routerLink="/seguimiento" routerLinkActive="active" title="Alertas">● <span>Alertas</span></a><a routerLink="/reportes" routerLinkActive="active" title="Reportes">● <span>Reportes</span></a><ng-container *ngIf="api.user()?.rol==='ADMINISTRADOR'"><div class="section-label">ADMINISTRACIÓN</div><a routerLink="/usuarios" routerLinkActive="active" title="Usuarios">● <span>Usuarios</span></a></ng-container></nav>
<div class="account" *ngIf="api.user() as user"><span class="avatar">{{initials}}</span><div><b>{{user.nombres}} {{user.apellidos}}</b><small>{{roleName(user.rol)}}</small></div></div><button aria-label="Cerrar sesión" class="logout" (click)="logout()" [disabled]="busy" title="Cerrar sesión">↪ <span>{{busy?'Saliendo…':'Cerrar sesión'}}</span></button><p *ngIf="error" role="alert" class="logout-error">{{error}}</p></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">{{eyebrow}}</div><h1>{{title}}</h1></div><a *ngIf="creating||back" routerLink="/cases" class="btn-secondary">{{creating?'Cancelar':'← Volver a casos'}}</a><a *ngIf="!creating&&!back&&!customActions" routerLink="/cases/nuevo" class="btn-primary">+ Registrar caso</a><ng-content select="[header-action]"></ng-content></header><ng-content></ng-content></main></div>
