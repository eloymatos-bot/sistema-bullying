spring.application.name=sistema-bullying-backend
spring.jackson.deserialization.accept-float-as-int=false

# La URL y las credenciales se configuran fuera del repositorio mediante variables de
# entorno (DB_URL, DB_USER, DB_PASSWORD) o mediante un archivo de propiedades local
# en .local/application-local.properties (ver README.md).
# El valor por defecto permite que Spring Boot arranque y muestre el error de conexión
# en lugar de fallar antes de llegar al contexto, con el mensaje 'url must start with jdbc'.
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=SistemaBullying;encrypt=true;trustServerCertificate=true;loginTimeout=5}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET CONCAT_NULL_YIELDS_NULL ON; SET ARITHABORT ON; SET NUMERIC_ROUNDABORT OFF;
spring.sql.init.mode=never
server.address=127.0.0.1
server.port=${APP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
